name: SpendFlow Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'OTA channel for the manual ota-update job (preview or production)'
        required: false
        default: 'preview'
        type: string

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo SDK configuration
        run: npx expo-doctor

      - name: Run financial and parsing regressions
        run: |
          npm run verify:fx
          npm run verify:format
          npm run verify:ocr
          npm run verify:export

      - name: Block critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

  database:
    name: Verify Supabase migrations and RLS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Apply migrations to a clean database
        run: npx supabase db reset

      - name: Run RLS regression suite
        run: npx supabase test db supabase/tests/rls_regression.sql

  deploy:
    name: Build website Android APK on EAS
    needs: [validate, database]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: GOOGLE_SERVICES_JSON

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Trigger EAS website APK build
        run: eas build --platform android --profile website --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}

      - name: Fetch built APK from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:list --platform android --profile website --non-interactive --limit 1 --json > build.json
          ARTIFACT_URL=$(jq -r '.[0].artifact.buildUrl // empty' build.json)
          BUILD_STATUS=$(jq -r '.[0].status' build.json)
          test "$BUILD_STATUS" = "FINISHED" || { echo "EAS build not FINISHED (status: $BUILD_STATUS)"; exit 1; }
          test -n "$ARTIFACT_URL" || { echo "No artifact URL on the latest build"; exit 1; }
          curl -L --fail --max-time 600 -o spendFlow.apk "$ARTIFACT_URL"
          # Sanity: real APK = zip magic + sane size
          head -c 2 spendFlow.apk | grep -q "PK" || { echo "Downloaded file is not an APK"; exit 1; }
          SIZE=$(stat -c %s spendFlow.apk)
          test "$SIZE" -gt 10000000 || { echo "APK suspiciously small ($SIZE bytes)"; exit 1; }
          echo "APK size: $SIZE bytes"

      - name: Publish APK to Supabase Storage (spendFlow_apk/spendFlow.apk)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Set repo secret SUPABASE_SERVICE_ROLE_KEY to enable APK publishing"; exit 1; }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST             "$SUPABASE_URL/storage/v1/object/spendFlow_apk/spendFlow.apk"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/vnd.android.package-archive"             -H "x-upsert: true"             --data-binary @spendFlow.apk)
          test "$CODE" = 200 || { echo "Storage upload failed (HTTP $CODE)"; exit 1; }
          echo "Published to Supabase Storage (HTTP $CODE)"

      - name: Update in-app release row (app_releases)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          VERSION=$(jq -r '.expo.version' app.json)
          APK_URL="$SUPABASE_URL/storage/v1/object/public/spendFlow_apk/spendFlow.apk?download=SpendFlow.apk"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH             "$SUPABASE_URL/rest/v1/app_releases?platform=eq.android"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             -H "Prefer: return=minimal"             -d "{\"latest_version\":\"$VERSION\",\"apk_url\":\"$APK_URL\"}")
          if [ "$CODE" = 404 ]; then
            curl -s -X POST "$SUPABASE_URL/rest/v1/app_releases"               -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"               -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"               -H "Content-Type: application/json"               -H "Prefer: return=minimal"               -d "{\"platform\":\"android\",\"latest_version\":\"$VERSION\",\"apk_url\":\"$APK_URL\"}"
          fi
          echo "app_releases -> latest_version $VERSION (HTTP $CODE)

  ota-update:
    name: Publish EAS Update (manual, JS-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update to preview channel
        if: ${{ inputs.channel == '' || inputs.channel == 'preview' }}
        run: eas update --channel preview --non-interactive --message "OTA from ${{ github.sha }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update to production channel (explicit dispatch only)
        if: ${{ inputs.channel == 'production' }}
        run: eas update --channel production --non-interactive --message "OTA from ${{ github.sha }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
