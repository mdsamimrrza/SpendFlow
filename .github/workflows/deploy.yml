name: SpendFlow Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'OTA channel for the manual ota-update job (preview or production)'
        required: false
        default: 'preview'
        type: string

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo SDK configuration
        run: npx expo-doctor

      - name: Run financial and parsing regressions
        run: |
          npm run verify:fx
          npm run verify:format
          npm run verify:ocr
          npm run verify:export

      - name: Block critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

  database:
    name: Verify Supabase migrations and RLS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Apply migrations to a clean database
        run: npx supabase db reset

      - name: Run RLS regression suite
        run: npx supabase test db supabase/tests/rls_regression.sql

  deploy:
    name: Build website Android APK on EAS
    needs: [validate, database]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: GOOGLE_SERVICES_JSON

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Trigger EAS website APK build
        run: eas build --platform android --profile website --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}

  ota-update:
    name: Publish EAS Update (manual, JS-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update to preview channel
        if: ${{ inputs.channel == '' || inputs.channel == 'preview' }}
        run: eas update --channel preview --non-interactive --message "OTA from ${{ github.sha }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update to production channel (explicit dispatch only)
        if: ${{ inputs.channel == 'production' }}
        run: eas update --channel production --non-interactive --message "OTA from ${{ github.sha }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
