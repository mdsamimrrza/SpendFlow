name: SpendFlow Automated Expo Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Publish to Expo
    runs-on: ubuntu-latest
    environment: GOOGLE_SERVICES_JSON

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔐 Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: ⚡ Trigger EAS Production Build (Expo.dev APK)
        run: eas build --platform android --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
